<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Performance Task 01: Multiple-choice Quiz</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header class="quiz-header">
            <p class="quiz-label">WEB DEVELOPMENT</p>
            <h1>HTML, CSS & JavaScript Quiz</h1>
            <p class="quiz-description">Test your knowledge of the three core technologies of the web.</p>
    </header>

    <main class="quiz-container">
        
        <section id="quiz-screen" class="quiz-card">
            <div id="questions-container"></div>
        </section>

        <section id="result-screen" class="result-card hidden">
            <p class="eyebrow">QUIZ COMPLETE</p>
            <h2>Your Final Score</h2>

            <div id="final-score" class="final-score">0 / 10</div>

            <p id="result-message" class="result-message"></p>

            <button id="restart-button" class="restart-button">
                Take Quiz Again
            </button>
        </section>

    </main>
    
</body>
</html>
